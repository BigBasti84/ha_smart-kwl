<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300" width="800" height="300">
  <!-- Background -->
  <rect width="800" height="300" fill="#1c1c1e" rx="0"/>

  <!-- Unit housing -->
  <rect x="120" y="30" width="560" height="240" fill="#2c2c2e" rx="10" stroke="#3a3a3c" stroke-width="1.5"/>

  <!-- ═══ Pipe segments ═══ -->
  <!-- Top-left pipe: Abluft → filter-left (orange) -->
  <rect x="120" y="80" width="130" height="40" fill="#ff6b00" opacity="0.85"/>
  <!-- Bottom-left pipe: filter-left out → heat exchanger (orange) -->
  <rect x="120" y="180" width="130" height="40" fill="#ff6b00" opacity="0.3"/>
  <!-- Top-right pipe: Aussenluft → filter-right (blue) -->
  <rect x="550" y="80" width="130" height="40" fill="#0a84ff" opacity="0.3"/>
  <!-- Bottom-right pipe: Fortluft → outside (blue) -->
  <rect x="550" y="180" width="130" height="40" fill="#0a84ff" opacity="0.85"/>

  <!-- Crossing diagonal flows through heat exchanger zone -->
  <!-- Orange: top-left → bottom-right (Abluft → Fortluft) -->
  <polygon points="250,80 310,80 420,220 360,220" fill="#ff6b00" opacity="0.7"/>
  <!-- Blue: top-right → bottom-left (Aussenluft → Zuluft) -->
  <polygon points="550,80 490,80 380,220 440,220" fill="#0a84ff" opacity="0.7"/>

  <!-- Heat exchanger diamond outline -->
  <polygon points="385,55 545,150 385,245 225,150" fill="none" stroke="#636366" stroke-width="1.5" stroke-dasharray="4,3"/>

  <!-- ═══ Filter blocks ═══ -->
  <!-- Filter left (id: filter-left) — filters Abluft -->
  <rect id="filter-left" x="246" y="60" width="24" height="180" rx="3" fill="#48484a" stroke="#636366" stroke-width="1"/>
  <text x="258" y="157" text-anchor="middle" fill="#aeaeb2" font-family="system-ui,sans-serif" font-size="9" font-weight="700" transform="rotate(-90,258,157)">FILTER</text>

  <!-- Filter right (id: filter-right) — filters Aussenluft -->
  <rect id="filter-right" x="530" y="60" width="24" height="180" rx="3" fill="#48484a" stroke="#636366" stroke-width="1"/>
  <text x="542" y="157" text-anchor="middle" fill="#aeaeb2" font-family="system-ui,sans-serif" font-size="9" font-weight="700" transform="rotate(-90,542,157)">FILTER</text>

  <!-- ═══ Port labels ═══ -->
  <!-- 1 Aussenluft – top right -->
  <text x="680" y="72" text-anchor="middle" fill="#0a84ff" font-family="system-ui,sans-serif" font-size="11" font-weight="700">Aussenluft</text>
  <text x="680" y="86" text-anchor="middle" fill="#636366" font-family="system-ui,sans-serif" font-size="9">① frische Luft</text>
  <!-- Arrow right→left -->
  <polygon points="658,100 648,95 648,105" fill="#0a84ff" opacity="0.7"/>

  <!-- 2 Zuluft – bottom left -->
  <text x="70" y="214" text-anchor="middle" fill="#ff6b00" font-family="system-ui,sans-serif" font-size="11" font-weight="700">Zuluft</text>
  <text x="70" y="228" text-anchor="middle" fill="#636366" font-family="system-ui,sans-serif" font-size="9">② in die Räume</text>
  <!-- Arrow right (going out left) -->
  <polygon points="118,200 128,195 128,205" fill="#ff6b00" opacity="0.7"/>

  <!-- 3 Abluft – top left -->
  <text x="70" y="72" text-anchor="middle" fill="#ff6b00" font-family="system-ui,sans-serif" font-size="11" font-weight="700">Abluft</text>
  <text x="70" y="86" text-anchor="middle" fill="#636366" font-family="system-ui,sans-serif" font-size="9">③ verbrauchte Luft</text>
  <!-- Arrow left→right -->
  <polygon points="118,100 108,95 108,105" fill="#ff6b00" opacity="0.7"/>

  <!-- 4 Fortluft – bottom right -->
  <text x="732" y="214" text-anchor="middle" fill="#0a84ff" font-family="system-ui,sans-serif" font-size="11" font-weight="700">Fortluft</text>
  <text x="732" y="228" text-anchor="middle" fill="#636366" font-family="system-ui,sans-serif" font-size="9">④ nach draussen</text>
  <!-- Arrow left (going out right) -->
  <polygon points="682,200 672,195 672,205" fill="#0a84ff" opacity="0.7"/>

  <!-- ═══ Temperature label zones (leave space for picture-elements overlays) ═══ -->
  <!-- Top-right temperature (Aussenluft): ~x=72%, y=30% -->
  <!-- Bottom-left temperature (Zuluft):   ~x=8%,  y=72% -->
  <!-- Top-left temperature (Abluft):      ~x=8%,  y=30% -->
  <!-- Bottom-right temperature (Fortluft):~x=84%, y=72% -->

  <!-- Wärmetauscher label -->
  <text x="385" y="154" text-anchor="middle" fill="#8e8e93" font-family="system-ui,sans-serif" font-size="12" font-weight="500">Wärmetauscher</text>
</svg>
