title: Smart KWL
views:
  - title: Overview
    path: smart-kwl
    icon: mdi:fan-auto
    badges: []
    cards:
      - type: heading
        heading: Smart KWL Ventilation

      - type: entities
        title: Status
        entities:
          - entity: binary_sensor.ventilation_on
            name: Ventilation On
          - entity: binary_sensor.summer_mode_active
            name: Summer Mode Active
          - entity: binary_sensor.night_mode_active
            name: Night Mode Active
          - entity: binary_sensor.smart_kwl_manual_override_active
            name: Manual Override Active

      - type: vertical-stack
        cards:
          - type: markdown
            content: "## Manual Override"

          - type: markdown
            content: "**Fan Speed**"

          - type: horizontal-stack
            cards:
              - type: custom:button-card
                entity: number.smart_kwl_manual_override_level
                name: "1"
                show_icon: false
                show_state: false
                tap_action:
                  action: call-service
                  service: number.set_value
                  service_data:
                    entity_id: number.smart_kwl_manual_override_level
                    value: 1
                styles:
                  card:
                    - border-radius: 6px
                    - padding: 8px 2px
                    - font-size: 14px
                    - font-weight: bold
                    - background-color: >
                        [[[
                          const ov = states['binary_sensor.smart_kwl_manual_override_active'].state === 'on'
                            || states['sensor.smart_kwl_external_manual_hold'].state !== 'none';
                          const sel = Math.round(parseFloat(entity.state)) === 1;
                          if (ov) return sel ? 'rgba(33,150,243,0.35)' : 'rgba(128,128,128,0.08)';
                          return sel ? '#2196F3' : 'rgba(128,128,128,0.18)';
                        ]]]
                    - color: >
                        [[[
                          const ov = states['binary_sensor.smart_kwl_manual_override_active'].state === 'on'
                            || states['sensor.smart_kwl_external_manual_hold'].state !== 'none';
                          const sel = Math.round(parseFloat(entity.state)) === 1;
                          if (ov) return sel ? 'rgba(255,255,255,0.5)' : 'rgba(255,255,255,0.25)';
                          return sel ? '#ffffff' : 'var(--secondary-text-color)';
                        ]]]
                  name:
                    - font-size: 14px
                    - font-weight: bold
