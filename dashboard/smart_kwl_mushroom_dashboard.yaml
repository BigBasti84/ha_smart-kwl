title: Smart KWL
views:
  - title: Overview
    path: smart-kwl
    icon: mdi:fan-auto
    badges: []
    cards:
      - type: heading
        heading: Smart KWL Ventilation

      - type: entities
        title: Status
        entities:
          - entity: binary_sensor.ventilation_on
            name: Ventilation On
          - entity: binary_sensor.summer_mode_active
            name: Summer Mode Active
          - entity: binary_sensor.night_mode_active
            name: Night Mode Active
          - entity: binary_sensor.smart_kwl_manual_override_active
            name: Manual Override Active

      - type: entities
        title: Manual Override
        entities:
          - entity: number.smart_kwl_manual_override_level
            name: Manual Override Level
          - entity: number.smart_kwl_manual_override_duration
            name: Manual Override Duration
          - entity: button.smart_kwl_apply_manual_override
            name: Apply Manual Override
          - entity: button.smart_kwl_cancel_manual_override
            name: Cancel Manual Override
          - entity: sensor.smart_kwl_manual_override_until
            name: Manual Override Until
          - entity: sensor.smart_kwl_external_manual_hold
            name: External Manual Hold

      - type: entities
        title: Current Values
        entities:
          - entity: sensor.target_fan_level
            name: Target Fan Level
          - entity: sensor.target_fan_percentage
            name: Target Fan Percentage
          - entity: sensor.humidity_combined
            name: Humidity Combined
          - entity: sensor.co2_combined
            name: CO2 Combined

      - type: entities
        title: Thresholds
        entities:
          - entity: sensor.humidity_low
            name: Humidity Low
          - entity: sensor.humidity_high
            name: Humidity High
          - entity: sensor.co2_low
            name: CO2 Low
          - entity: sensor.co2_high
            name: CO2 High

      - type: heading
        heading: Temperatures

      - type: entities
        title: Temperature Sensors
        entities:
          - entity: sensor.incoming_temperature
            name: Incoming Temperature
          - entity: sensor.outgoing_temperature
            name: Outgoing Temperature
          - entity: sensor.outside_temperature
            name: Outside Temperature
          - entity: sensor.exhaust_temperature
            name: Exhaust Temperature

      - type: history-graph
        title: Temperature History (24h)
        hours_to_show: 24
        entities:
          - sensor.incoming_temperature
          - sensor.outgoing_temperature
          - sensor.outside_temperature
          - sensor.exhaust_temperature

      - type: history-graph
        title: Fan, Humidity, CO2 History (24h)
        hours_to_show: 24
        entities:
          - sensor.target_fan_level
          - sensor.humidity_combined
          - sensor.co2_combined

      - type: heading
        heading: Filter Maintenance

      - type: entities
        title: Filter Status
        entities:
          - entity: sensor.smart_kwl_filter_cleaning_status
            name: Filter Cleaning Status
          - entity: sensor.smart_kwl_filter_days_since_cleaning
            name: Filter Days Since Cleaning
          - entity: sensor.smart_kwl_filter_days_remaining
            name: Filter Days Remaining
          - entity: sensor.smart_kwl_filter_months_remaining
            name: Filter Months Remaining
          - entity: sensor.smart_kwl_filter_last_cleaned
            name: Filter Last Cleaned
          - entity: button.smart_kwl_filters_cleaned
            name: Filters Cleaned

      - type: heading
        heading: Check Log

      - type: entities
        title: Last Check
        entities:
          - entity: sensor.check_log
            name: Last Check

      - type: markdown
        title: Recent Changes (Last 5)
        content: |
          {% set changes = state_attr('sensor.check_log', 'change_history') or [] %}
          {% if changes | count == 0 %}
          No level changes recorded yet.
          {% else %}
          {% for change in changes[:5] %}
          {% set ts = change.at if change.at is defined else '' %}
          {% set ts_fmt = ts[:10].split('-') | reverse | join('-') ~ ' ' ~ ts[11:16] if ts | length >= 16 else ts %}
          **{{ ts_fmt }}** - Fan {{ change.before_level }} -> **{{ change.after_level }}** ({{ change.reason }})
          {% endfor %}
          {% endif %}
