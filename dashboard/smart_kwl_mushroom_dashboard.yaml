title: Smart KWL
views:
  - title: Overview
    path: smart-kwl
    icon: mdi:fan-auto
    badges: []
    cards:
      - type: heading
        heading: Smart KWL Ventilation

      - type: entities
        title: Status
        entities:
          - binary_sensor.ventilation_on
          - binary_sensor.summer_mode_active
          - binary_sensor.night_mode_active
          - binary_sensor.smart_kwl_manual_override_active

      - type: entities
        title: Manual Override
        entities:
          - number.smart_kwl_manual_override_level
          - number.smart_kwl_manual_override_duration
          - button.smart_kwl_apply_manual_override
          - button.smart_kwl_cancel_manual_override
          - sensor.smart_kwl_manual_override_until
          - sensor.smart_kwl_external_manual_hold

      - type: entities
        title: Current Values
        entities:
          - sensor.target_fan_level
          - sensor.target_fan_percentage
          - sensor.humidity_combined
          - sensor.co2_combined

      - type: entities
        title: Thresholds
        entities:
          - sensor.humidity_low
          - sensor.humidity_high
          - sensor.co2_low
          - sensor.co2_high

      - type: heading
        heading: Temperatures

      - type: entities
        title: Temperature Sensors
        entities:
          - sensor.incoming_temperature
          - sensor.outgoing_temperature
          - sensor.outside_temperature
          - sensor.exhaust_temperature

      - type: history-graph
        title: Temperature History (24h)
        hours_to_show: 24
        entities:
          - sensor.incoming_temperature
          - sensor.outgoing_temperature
          - sensor.outside_temperature
          - sensor.exhaust_temperature

      - type: history-graph
        title: Fan, Humidity, CO2 History (24h)
        hours_to_show: 24
        entities:
          - sensor.target_fan_level
          - sensor.humidity_combined
          - sensor.co2_combined

      - type: heading
        heading: Filter Maintenance

      - type: entities
        title: Filter Status
        entities:
          - sensor.smart_kwl_filter_cleaning_status
          - sensor.smart_kwl_filter_days_since_cleaning
          - sensor.smart_kwl_filter_days_remaining
          - sensor.smart_kwl_filter_months_remaining
          - sensor.smart_kwl_filter_last_cleaned
          - button.smart_kwl_filters_cleaned

      - type: heading
        heading: Check Log

      - type: entities
        title: Last Check
        entities:
          - sensor.check_log

      - type: markdown
        title: Recent Changes (Last 5)
        content: |
          {% set changes = state_attr('sensor.check_log', 'change_history') or [] %}
          {% if changes | count == 0 %}
          No level changes recorded yet.
          {% else %}
          {% for change in changes[:5] %}
          {% set ts = change.at if change.at is defined else '' %}
          {% set ts_fmt = ts[:10].split('-') | reverse | join('-') ~ ' ' ~ ts[11:16] if ts | length >= 16 else ts %}
          **{{ ts_fmt }}** - Fan {{ change.before_level }} -> **{{ change.after_level }}** ({{ change.reason }})
          {% endfor %}
          {% endif %}
