title: Smart KWL Dashboard
path: smart-kwl
icon: mdi:fan-auto
cards:
  - type: custom:mushroom-title-card
    title: Smart KWL
    subtitle: Auto-adaptive dashboard (entity IDs discovered automatically)

  - type: custom:mushroom-chips-card
    chips:
      - type: template
        icon: mdi:fan
        content: >-
          {% set e = states.binary_sensor | map(attribute='entity_id') | select('search', '_ventilation_on$') | list | first %}
          Ventilation: {{ 'On' if e and is_state(e, 'on') else 'Off' }}
        icon_color: >-
          {% set e = states.binary_sensor | map(attribute='entity_id') | select('search', '_ventilation_on$') | list | first %}
          {{ 'green' if e and is_state(e, 'on') else 'grey' }}
      - type: template
        icon: mdi:white-balance-sunny
        content: >-
          {% set e = states.binary_sensor | map(attribute='entity_id') | select('search', '_summer_mode_active$') | list | first %}
          Summer: {{ 'On' if e and is_state(e, 'on') else 'Off' }}
        icon_color: >-
          {% set e = states.binary_sensor | map(attribute='entity_id') | select('search', '_summer_mode_active$') | list | first %}
          {{ 'amber' if e and is_state(e, 'on') else 'grey' }}
      - type: template
        icon: mdi:weather-night
        content: >-
          {% set e = states.binary_sensor | map(attribute='entity_id') | select('search', '_night_mode_active$') | list | first %}
          Night: {{ 'On' if e and is_state(e, 'on') else 'Off' }}
        icon_color: >-
          {% set e = states.binary_sensor | map(attribute='entity_id') | select('search', '_night_mode_active$') | list | first %}
          {{ 'deep-purple' if e and is_state(e, 'on') else 'grey' }}

  - type: horizontal-stack
    cards:
      - type: custom:mushroom-template-card
        icon: mdi:fan-chevron-up
        primary: Current Fan Speed
        secondary: >-
          {% set level = states.sensor | map(attribute='entity_id') | select('search', '_target_fan_level$') | list | first %}
          {% set pct = states.sensor | map(attribute='entity_id') | select('search', '_target_fan_percentage$') | list | first %}
          {% if level %}
          {{ states(level) }} / 8
          {% if pct %}
          ({{ states(pct) }}%)
          {% endif %}
          {% else %}
          No fan level sensor found
          {% endif %}
      - type: custom:mushroom-template-card
        icon: mdi:molecule-co2
        primary: >-
          {% set c = states.sensor | map(attribute='entity_id') | select('search', '_co2_combined$') | list | first %}
          CO2: {{ states(c) if c else 'n/a' }} ppm
        secondary: >-
          {% set lo = states.sensor | map(attribute='entity_id') | select('search', '_co2_low$') | list | first %}
          {% set hi = states.sensor | map(attribute='entity_id') | select('search', '_co2_high$') | list | first %}
          Low {{ states(lo) if lo else 'n/a' }} / High {{ states(hi) if hi else 'n/a' }} ppm

  - type: custom:mushroom-template-card
    icon: mdi:water-percent
    primary: >-
      {% set h = states.sensor | map(attribute='entity_id') | select('search', '_humidity_combined$') | list | first %}
      Humidity: {{ states(h) if h else 'n/a' }} %
    secondary: >-
      {% set lo = states.sensor | map(attribute='entity_id') | select('search', '_humidity_low$') | list | first %}
      {% set hi = states.sensor | map(attribute='entity_id') | select('search', '_humidity_high$') | list | first %}
      Low {{ states(lo) if lo else 'n/a' }} / High {{ states(hi) if hi else 'n/a' }} %

  - type: custom:auto-entities
    card:
      type: history-graph
      title: Current Fan Speed (24h)
      hours_to_show: 24
      refresh_interval: 60
    filter:
      include:
        - domain: sensor
          entity_id: '*_target_fan_level'
      exclude: []
    show_empty: true

  - type: markdown
    title: Compact Log (Last 5 Changes)
    content: |
      {% set preferred = 'sensor.smart_kwl_check_log' %}
      {% set ns = namespace(entity=None, candidates=[]) %}

      {% if state_attr(preferred, 'check_history') is not none %}
        {% set ns.entity = preferred %}
      {% else %}
        {% for s in states.sensor %}
          {% if state_attr(s.entity_id, 'check_history') is not none %}
            {% set ns.candidates = ns.candidates + [s.entity_id] %}
          {% endif %}
        {% endfor %}
        {% if ns.candidates | count > 0 %}
          {% set ns.entity = ns.candidates[0] %}
        {% endif %}
      {% endif %}

      {% if not ns.entity %}
      No check log sensor found (attribute `check_history`).
      {% else %}
      {% set history = state_attr(ns.entity, 'check_history') or [] %}
      {% if history | count == 0 %}
      No changes available yet.
      {% else %}
      {% for run in history[:5] %}
      {% set ts = run[0].split('at=')[-1] if run | count > 0 else 'n/a' %}
      {% set action = (run | select('search', '^action \|') | list | first) %}
      {% if action %}
      {% set reason = action.split('reason=')[-1].split(' |')[0] if 'reason=' in action else 'unknown' %}
      {% set level = action.split('after_level=')[-1].split(' ')[0] if 'after_level=' in action else 'n/a' %}
      - {{ ts }}: Set Fan Speed to {{ level }} because of {{ reason }}
      {% endif %}
      {% endfor %}
      {% endif %}
      {% endif %}

  - type: custom:auto-entities
    card:
      type: history-graph
      title: Incoming / Outgoing Temperatures (24h)
      hours_to_show: 24
      refresh_interval: 60
    filter:
      include:
        - domain: sensor
          entity_id: '*_incoming_temperature'
        - domain: sensor
          entity_id: '*_outgoing_temperature'
      exclude: []
    show_empty: true

  - type: markdown
    title: Notes
    content: |
      This dashboard uses:
      - `Mushroom` cards
      - `auto-entities` for dynamic graph entity discovery

      If graphs are empty, install the `auto-entities` Lovelace card from HACS (Frontend).
