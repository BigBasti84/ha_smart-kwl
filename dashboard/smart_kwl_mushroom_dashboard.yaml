title: Smart KWL
views:
  - title: Overview
    path: smart-kwl
    icon: mdi:fan-auto
    badges: []
    cards:
      - type: heading
        heading: Smart KWL Ventilation

      - type: entities
        title: Status
        entities:
          - entity: binary_sensor.ventilation_on
            name: Ventilation On
          - entity: binary_sensor.summer_mode_active
            name: Summer Mode Active
          - entity: binary_sensor.night_mode_active
            name: Night Mode Active
          - entity: binary_sensor.smart_kwl_manual_override_active
            name: Manual Override Active

      - type: vertical-stack
        cards:
          - type: markdown
            content: "## Manual Override"

          - type: markdown
            content: "**Fan Speed (1–8)**"

          - type: horizontal-stack\n            cards:\n              - type: custom:button-card
                entity: number.smart_kwl_manual_override_level
                name: "1"
                show_icon: false
                show_state: false
                show_label: false
                size: 100%
                tap_action:
                  action: call-service
                  service: number.set_value
                  service_data:
                    entity_id: number.smart_kwl_manual_override_level
                    value: 1
                styles:
                  card:
                    - width: 100%
                    - border-radius: 8px
                    - padding: 12px 0px
                    - font-size: 16px
                    - font-weight: 600
                    - background-color: |
                        [[[
                          const isActive = Math.round(parseFloat(entity.state)) === 1;
                          const isDisabled = states['binary_sensor.smart_kwl_manual_override_active'].state === 'on'
                            || states['sensor.smart_kwl_external_manual_hold'].state !== 'none';
                          if (isDisabled) return isActive ? 'rgba(33,150,243,0.25)' : 'rgba(128,128,128,0.08)';
                          return isActive ? '#2196F3' : 'rgba(128,128,128,0.12)';
                        ]]]
                    - color: |
                        [[[
                          const isActive = Math.round(parseFloat(entity.state)) === 1;
                          const isDisabled = states['binary_sensor.smart_kwl_manual_override_active'].state === 'on'
                            || states['sensor.smart_kwl_external_manual_hold'].state !== 'none';
                          if (isDisabled) return isActive ? '#ffffff' : 'rgba(255,255,255,0.25)';
                          return isActive ? '#ffffff' : '#000000';
                        ]]]
                    - border: |
                        [[[
                          const isActive = Math.round(parseFloat(entity.state)) === 1;
                          return isActive ? '2px solid #2196F3' : '1px solid rgba(128,128,128,0.2)';
                        ]]]
                  name:
                    - font-size: 16px
                    - font-weight: 600

