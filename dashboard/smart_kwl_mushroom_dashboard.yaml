title: Home
views:
  - title: Smart KWL Dashboard
    path: smart-kwl
    icon: mdi:fan-auto
    cards:
      - type: custom:mushroom-title-card
        title: Smart KWL
        subtitle: Stable dashboard with runtime diagnostics

      - type: custom:mushroom-chips-card
        chips:
          - type: template
            icon: mdi:fan
            content: >-
              {% set ns = namespace(e='') %}
              {% for b in states.binary_sensor %}
                {% if b.entity_id.endswith('_ventilation_on') %}
                  {% set ns.e = b.entity_id %}
                {% endif %}
              {% endfor %}
              Ventilation: {{ 'On' if ns.e and is_state(ns.e, 'on') else 'Off' }}
            icon_color: >-
              {% set ns = namespace(e='') %}
              {% for b in states.binary_sensor %}
                {% if b.entity_id.endswith('_ventilation_on') %}
                  {% set ns.e = b.entity_id %}
                {% endif %}
              {% endfor %}
              {{ 'green' if ns.e and is_state(ns.e, 'on') else 'grey' }}

          - type: template
            icon: mdi:white-balance-sunny
            content: >-
              {% set ns = namespace(e='') %}
              {% for b in states.binary_sensor %}
                {% if b.entity_id.endswith('_summer_mode_active') %}
                  {% set ns.e = b.entity_id %}
                {% endif %}
              {% endfor %}
              Summer: {{ 'On' if ns.e and is_state(ns.e, 'on') else 'Off' }}
            icon_color: >-
              {% set ns = namespace(e='') %}
              {% for b in states.binary_sensor %}
                {% if b.entity_id.endswith('_summer_mode_active') %}
                  {% set ns.e = b.entity_id %}
                {% endif %}
              {% endfor %}
              {{ 'amber' if ns.e and is_state(ns.e, 'on') else 'grey' }}

          - type: template
            icon: mdi:weather-night
            content: >-
              {% set ns = namespace(e='') %}
              {% for b in states.binary_sensor %}
                {% if b.entity_id.endswith('_night_mode_active') %}
                  {% set ns.e = b.entity_id %}
                {% endif %}
              {% endfor %}
              Night: {{ 'On' if ns.e and is_state(ns.e, 'on') else 'Off' }}
            icon_color: >-
              {% set ns = namespace(e='') %}
              {% for b in states.binary_sensor %}
                {% if b.entity_id.endswith('_night_mode_active') %}
                  {% set ns.e = b.entity_id %}
                {% endif %}
              {% endfor %}
              {{ 'deep-purple' if ns.e and is_state(ns.e, 'on') else 'grey' }}

      - type: horizontal-stack
        cards:
          - type: custom:mushroom-template-card
            icon: mdi:fan-chevron-up
            primary: Current Fan Speed
            secondary: >-
              {% set ns = namespace(level='', pct='') %}
              {% for s in states.sensor %}
                {% if s.entity_id.endswith('_target_fan_level') %}
                  {% set ns.level = s.entity_id %}
                {% endif %}
                {% if s.entity_id.endswith('_target_fan_percentage') %}
                  {% set ns.pct = s.entity_id %}
                {% endif %}
              {% endfor %}
              {% if ns.level %}
              {{ states(ns.level) }} / 8{% if ns.pct %} ({{ states(ns.pct) }}%){% endif %}
              {% else %}
              No fan level sensor found
              {% endif %}

          - type: custom:mushroom-template-card
            icon: mdi:molecule-co2
            primary: >-
              {% set ns = namespace(c='') %}
              {% for s in states.sensor %}
                {% if s.entity_id.endswith('_co2_combined') %}
                  {% set ns.c = s.entity_id %}
                {% endif %}
              {% endfor %}
              CO2: {{ states(ns.c) if ns.c else 'n/a' }} ppm
            secondary: >-
              {% set ns = namespace(lo='', hi='') %}
              {% for s in states.sensor %}
                {% if s.entity_id.endswith('_co2_low') %}
                  {% set ns.lo = s.entity_id %}
                {% endif %}
                {% if s.entity_id.endswith('_co2_high') %}
                  {% set ns.hi = s.entity_id %}
                {% endif %}
              {% endfor %}
              Low {{ states(ns.lo) if ns.lo else 'n/a' }} / High {{ states(ns.hi) if ns.hi else 'n/a' }} ppm

      - type: custom:mushroom-template-card
        icon: mdi:water-percent
        primary: >-
          {% set ns = namespace(h='') %}
          {% for s in states.sensor %}
            {% if s.entity_id.endswith('_humidity_combined') %}
              {% set ns.h = s.entity_id %}
            {% endif %}
          {% endfor %}
          Humidity: {{ states(ns.h) if ns.h else 'n/a' }} %
        secondary: >-
          {% set ns = namespace(lo='', hi='') %}
          {% for s in states.sensor %}
            {% if s.entity_id.endswith('_humidity_low') %}
              {% set ns.lo = s.entity_id %}
            {% endif %}
            {% if s.entity_id.endswith('_humidity_high') %}
              {% set ns.hi = s.entity_id %}
            {% endif %}
          {% endfor %}
          Low {{ states(ns.lo) if ns.lo else 'n/a' }} / High {{ states(ns.hi) if ns.hi else 'n/a' }} %

      - type: history-graph
        title: Current Fan Speed (24h)
        hours_to_show: 24
        refresh_interval: 60
        entities:
          - entity: sensor.smart_kwl_target_fan_level
            name: Fan Level

      - type: markdown
        title: Compact Log (Last 5 Changes)
        content: |
          {% set preferred = 'sensor.smart_kwl_check_log' %}
          {% set ns = namespace(entity='', candidates='') %}

          {% if state_attr(preferred, 'check_history') is not none %}
            {% set ns.entity = preferred %}
          {% else %}
            {% for s in states.sensor %}
              {% if state_attr(s.entity_id, 'check_history') is not none %}
                {% set ns.entity = s.entity_id %}
              {% endif %}
            {% endfor %}
          {% endif %}

          {% if not ns.entity %}
          No check log sensor found.
          {% else %}
          {% set history = state_attr(ns.entity, 'check_history') or [] %}
          {% set counts = namespace(shown=0) %}
          {% if history | count == 0 %}
          No changes available yet.
          {% else %}
          {% for run in history %}
          {% set action = (run | select('search', '^action \|') | list | first) %}
          {% if action and 'status=applied' in action and counts.shown < 5 %}
          {% set counts.shown = counts.shown + 1 %}
          {% set ts = run[0].split('at=')[-1] if run | count > 0 else '' %}
          {% set ts_fmt = ts[:10].split('-') | reverse | join('-') ~ ' -' ~ ts[11:16] if ts | length >= 16 else ts %}
          {% set reason_raw = action.split('reason=')[-1].split(' |')[0] if 'reason=' in action else 'unknown' %}
          {% set reason_map = {
            'idle_base_default': 'Idle – normal mode',
            'idle_base_away': 'Idle – away mode',
            'humidity_base_default': 'High humidity',
            'humidity_base_away': 'High humidity – away mode',
            'co2_base_default': 'High CO2',
            'co2_base_away': 'High CO2 – away mode',
            'night': 'Night mode',
            'night_summer': 'Night mode (summer)',
            'manual': 'Manual override'
          } %}
          {% set reason = reason_map[reason_raw] if reason_raw in reason_map else reason_raw %}
          {% set level = action.split('after_level=')[-1].split(' ')[0] if 'after_level=' in action else 'n/a' %}
          - {{ ts_fmt }}: Fan → {{ level }} ({{ reason }})
          {% endif %}
          {% endfor %}
          {% if counts.shown == 0 %}
          No fan speed changes recorded yet.
          {% endif %}
          {% endif %}
          {% endif %}

      - type: history-graph
        title: Incoming / Outgoing Temperatures (24h)
        hours_to_show: 24
        refresh_interval: 60
        entities:
          - entity: sensor.smart_kwl_incoming_temperature
            name: Incoming
          - entity: sensor.smart_kwl_outgoing_temperature
            name: Outgoing

      - type: markdown
        title: Diagnostics
        content: |
          Detected Smart KWL entities in this HA instance:

          {% for s in states.sensor %}
          {% if '_target_fan_level' in s.entity_id
             or '_target_fan_percentage' in s.entity_id
             or '_co2_combined' in s.entity_id
             or '_co2_low' in s.entity_id
             or '_co2_high' in s.entity_id
             or '_humidity_combined' in s.entity_id
             or '_humidity_low' in s.entity_id
             or '_humidity_high' in s.entity_id
             or '_incoming_temperature' in s.entity_id
             or '_outgoing_temperature' in s.entity_id %}
          - {{ s.entity_id }} = {{ states(s.entity_id) }}
          {% endif %}
          {% endfor %}

          {% for b in states.binary_sensor %}
          {% if '_ventilation_on' in b.entity_id or '_summer_mode_active' in b.entity_id or '_night_mode_active' in b.entity_id %}
          - {{ b.entity_id }} = {{ states(b.entity_id) }}
          {% endif %}
          {% endfor %}
