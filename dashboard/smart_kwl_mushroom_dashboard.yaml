                            || states['sensor.smart_kwl_external_manual_hold'].state !== 'none';
                          const sel = Math.round(parseFloat(entity.state)) === 8;
                          if (ov) return sel ? 'rgba(255,255,255,0.5)' : 'rgba(255,255,255,0.25)';
                          return sel ? '#ffffff' : 'var(--secondary-text-color)';
                        ]]]
                  name:
                    - font-size: 14px
                    - font-weight: bold

          - type: horizontal-stack
            cards:
              - type: custom:button-card
                name: "\u25b6  Start"
                show_icon: false
                tap_action:
                  action: call-service
                  service: button.press
                  service_data:
                    entity_id: button.smart_kwl_apply_manual_override
                styles:
                  card:
                    - border-radius: 8px
                    - padding: 14px 8px
                    - font-size: 15px
                    - font-weight: bold
                    - background-color: >
                        [[[
                          const ov = states['binary_sensor.smart_kwl_manual_override_active'].state === 'on'
                            || states['sensor.smart_kwl_external_manual_hold'].state !== 'none';
                          return ov ? 'rgba(128,128,128,0.1)' : '#4CAF50';
                        ]]]
                    - color: >
                        [[[
                          const ov = states['binary_sensor.smart_kwl_manual_override_active'].state === 'on'
                            || states['sensor.smart_kwl_external_manual_hold'].state !== 'none';
                          return ov ? 'rgba(255,255,255,0.25)' : '#ffffff';
                        ]]]
                  name:
                    - font-size: 15px
                    - font-weight: bold
              - type: custom:button-card
                name: "\u2715  Cancel"
                show_icon: false
                tap_action:
                  action: call-service
                  service: button.press
                  service_data:
                    entity_id: button.smart_kwl_cancel_manual_override
                styles:
                  card:
                    - border-radius: 8px
                    - padding: 14px 8px
                    - font-size: 15px
                    - font-weight: bold
                    - background-color: >
                        [[[
                          const ov = states['binary_sensor.smart_kwl_manual_override_active'].state === 'on'
                            || states['sensor.smart_kwl_external_manual_hold'].state !== 'none';
                          return ov ? '#F44336' : 'rgba(128,128,128,0.1)';
                        ]]]
                    - color: >
                        [[[
                          const ov = states['binary_sensor.smart_kwl_manual_override_active'].state === 'on'
                            || states['sensor.smart_kwl_external_manual_hold'].state !== 'none';
                          return ov ? '#ffffff' : 'rgba(255,255,255,0.25)';
                        ]]]
                  name:
                    - font-size: 15px
                    - font-weight: bold

          - type: conditional
            conditions:
              - entity: binary_sensor.smart_kwl_manual_override_active
                state: "on"
            card:
              type: custom:button-card
              entity: sensor.smart_kwl_manual_override_until
              show_icon: false
              show_state: false
              name: >
                [[[
                  const until = entity.state;
                  if (!until || until === 'unknown' || until === 'unavailable' || until === 'None') {
                    return 'Override active';
                  }
                  const end = new Date(until);
                  const now = new Date();
                  const ms = Math.max(0, end - now);
                  const h = Math.floor(ms / 3600000);
                  const m = Math.floor((ms % 3600000) / 60000);
                  return (h > 0 ? h + 'h ' : '') + m + 'm remaining';
                ]]]
              styles:
                card:
                  - border-radius: 8px
                  - padding: 14px 16px
                  - font-size: 13px
                  - font-weight: bold
                  - color: "#ffffff"
                  - text-align: left
                  - background: >
                      [[[
                        const until = entity.state;
                        if (!until || until === 'unknown' || until === 'unavailable' || until === 'None') {
                          return 'rgba(33,150,243,0.5)';
                        }
                        const end = new Date(until);
                        const now = new Date();
                        const ms = Math.max(0, end - now);
                        const dh = parseFloat(states['number.smart_kwl_manual_override_duration'].state) || 1;
                        const total = dh * 3600000;
                        const pct = Math.round(Math.min(100, (ms / total) * 100));
                        return 'linear-gradient(to right, rgba(33,150,243,0.85) ' + pct + '%, rgba(128,128,128,0.15) ' + pct + '%)';
                      ]]]
                name:
                  - font-size: 13px
                  - font-weight: bold
                  - color: "#ffffff"

      - type: entities
        title: Current Values
        entities:
          - entity: sensor.target_fan_level
            name: Target Fan Level
          - entity: sensor.target_fan_percentage
            name: Target Fan Percentage
          - entity: sensor.humidity_combined
            name: Humidity Combined
          - entity: sensor.co2_combined
            name: CO2 Combined

      - type: entities
        title: Thresholds
        entities:
          - entity: sensor.humidity_low
            name: Humidity Low
          - entity: sensor.humidity_high
            name: Humidity High
          - entity: sensor.co2_low
            name: CO2 Low
          - entity: sensor.co2_high
            name: CO2 High

      - type: heading
        heading: Temperatures

      - type: entities
        title: Temperature Sensors
        entities:
          - entity: sensor.incoming_temperature
            name: Incoming Temperature
          - entity: sensor.outgoing_temperature
            name: Outgoing Temperature
          - entity: sensor.outside_temperature
            name: Outside Temperature
          - entity: sensor.exhaust_temperature
            name: Exhaust Temperature

      - type: history-graph
        title: Temperature History (24h)
        hours_to_show: 24
        entities:
          - sensor.incoming_temperature
          - sensor.outgoing_temperature
          - sensor.outside_temperature
          - sensor.exhaust_temperature

      - type: history-graph
        title: Fan, Humidity, CO2 History (24h)
        hours_to_show: 24
        entities:
          - sensor.target_fan_level
          - sensor.humidity_combined
          - sensor.co2_combined

      - type: heading
        heading: Filter Maintenance

      - type: entities
        title: Filter Status
        entities:
          - entity: sensor.smart_kwl_filter_cleaning_status
            name: Filter Cleaning Status
          - entity: sensor.smart_kwl_filter_days_since_cleaning
            name: Filter Days Since Cleaning
          - entity: sensor.smart_kwl_filter_days_remaining
            name: Filter Days Remaining
          - entity: sensor.smart_kwl_filter_months_remaining
            name: Filter Months Remaining
          - entity: sensor.smart_kwl_filter_last_cleaned
            name: Filter Last Cleaned
          - entity: button.smart_kwl_filters_cleaned
            name: Filters Cleaned

      - type: heading
        heading: Check Log

      - type: entities
        title: Last Check
        entities:
          - entity: sensor.check_log
            name: Last Check

      - type: markdown
        title: Recent Changes (Last 5)
        content: |
          {% set changes = state_attr('sensor.check_log', 'change_history') or [] %}
          {% if changes | count == 0 %}
          No level changes recorded yet.
          {% else %}
          {% for change in changes[:5] %}
          {% set ts = change.at if change.at is defined else '' %}
          {% set ts_fmt = ts[:10].split('-') | reverse | join('-') ~ ' ' ~ ts[11:16] if ts | length >= 16 else ts %}
          **{{ ts_fmt }}** - Fan {{ change.before_level }} -> **{{ change.after_level }}** ({{ change.reason }})
          {% endfor %}
          {% endif %}
