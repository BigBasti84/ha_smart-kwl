title: Smart KWL
views:
  - title: Overview
    path: smart-kwl
    icon: mdi:fan-auto
    badges: []
    cards:
      - type: heading
        heading: Smart KWL Ventilation

      - type: entities
        title: Status
        entities:
          - binary_sensor.smart_kwl_ventilation_on
          - binary_sensor.smart_kwl_summer_mode_active
          - binary_sensor.smart_kwl_night_mode_active

      - type: entities
        title: Current Values
        entities:
          - sensor.smart_kwl_target_fan_level
          - sensor.smart_kwl_target_fan_percentage
          - sensor.smart_kwl_humidity_combined
          - sensor.smart_kwl_co2_combined

      - type: entities
        title: Thresholds
        entities:
          - sensor.smart_kwl_humidity_low
          - sensor.smart_kwl_humidity_high
          - sensor.smart_kwl_co2_low
          - sensor.smart_kwl_co2_high

      - type: heading
        heading: Temperatures

      - type: entities
        title: Temperature Sensors
        entities:
          - sensor.smart_kwl_incoming_temperature
          - sensor.smart_kwl_outgoing_temperature
          - sensor.smart_kwl_outside_temperature
          - sensor.smart_kwl_exhaust_temperature

      - type: history-graph
        title: Temperature History (24h)
        hours_to_show: 24
        entities:
          - sensor.smart_kwl_incoming_temperature
          - sensor.smart_kwl_outgoing_temperature
          - sensor.smart_kwl_outside_temperature
          - sensor.smart_kwl_exhaust_temperature

      - type: history-graph
        title: Fan Speed History (24h)
        hours_to_show: 24
        entities:
          - sensor.smart_kwl_target_fan_level

      - type: heading
        heading: Filter Maintenance

      - type: entities
        title: Filter Status
        entities:
          - sensor.smart_kwl_filter_cleaning_status
          - sensor.smart_kwl_filter_days_since_cleaning
          - sensor.smart_kwl_filter_days_remaining
          - sensor.smart_kwl_filter_last_cleaned
          - sensor.smart_kwl_filter_install_date
          - button.smart_kwl_filters_cleaned

      - type: heading
        heading: Check Log

      - type: entities
        title: Last Check
        entities:
          - sensor.smart_kwl_check_log

      - type: markdown
        title: Recent Changes (Last 5)
        content: |
          {% set history = state_attr('sensor.smart_kwl_check_log', 'check_history') or [] %}
          {% set counts = namespace(shown=0) %}
          {% if history | count == 0 %}
          No changes recorded yet.
          {% else %}
          {% for run in history %}
          {% set action = (run | select('search', '^action \|') | list | first) %}
          {% if action and 'status=applied' in action and counts.shown < 5 %}
          {% set counts.shown = counts.shown + 1 %}
          {% set ts = run[0].split('at=')[-1] if run | count > 0 else '' %}
          {% set ts_fmt = ts[:10].split('-') | reverse | join('-') ~ ' ' ~ ts[11:16] if ts | length >= 16 else ts %}
          {% set reason_raw = action.split('reason=')[-1].split(' |')[0] if 'reason=' in action else 'unknown' %}
          {% set level = action.split('after_level=')[-1].split(' ')[0] if 'after_level=' in action else 'n/a' %}
          **{{ ts_fmt }}** — Fan → **{{ level }}** ({{ reason_raw }})
          {% endif %}
          {% endfor %}
          {% endif %}
