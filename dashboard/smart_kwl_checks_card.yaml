type: markdown
title: Smart KWL - Last 10 Checks
content: |
  {% set preferred = 'sensor.smart_kwl_check_log' %}
  {% set ns = namespace(entity=None, candidates=[]) %}

  {% if state_attr(preferred, 'check_history') is not none %}
    {% set ns.entity = preferred %}
  {% else %}
    {% for s in states.sensor %}
      {% if state_attr(s.entity_id, 'check_history') is not none %}
        {% set ns.candidates = ns.candidates + [s.entity_id] %}
      {% endif %}
    {% endfor %}
    {% if ns.candidates | count > 0 %}
      {% set ns.entity = ns.candidates[0] %}
    {% endif %}
  {% endif %}

  {% if not ns.entity %}
  No Smart KWL check log sensor found.

  Open Developer Tools -> States and search for entities that have attribute `check_history`.

  {% if ns.candidates | count > 0 %}
  Possible candidates found:
  {% for e in ns.candidates %}
  - {{ e }}
  {% endfor %}
  {% endif %}
  {% else %}
  {% set history = state_attr(ns.entity, 'check_history') or [] %}

  {% if history | count == 0 %}
  No checks available yet for {{ ns.entity }}.
  {% else %}
  Showing data from **{{ ns.entity }}**

  {% for run in history %}
  ### Check {{ loop.index }}
  {% for line in run %}
  - {{ line }}
  {% endfor %}

  {% endfor %}
  {% endif %}
  {% endif %}
